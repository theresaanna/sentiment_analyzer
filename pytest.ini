[pytest]
markers =
    integration: marks tests as integration tests that require external services (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks tests as end-to-end tests that require a running server (deselect with '-m "not e2e"')
    youtube: marks tests that require YouTube API access (deselect with '-m "not youtube"')
    redis: marks tests that require Redis connection (deselect with '-m "not redis"')

# Test discovery and execution settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --tb=short -v
